<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Pet — Galerie des emotes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0b0e; color: #d7dae2;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(10, 11, 14, 0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #1e2128; padding: 12px 20px;
    display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: center;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .ctl { display: flex; align-items: center; gap: 8px; }
  header label { color: #8b909c; font-size: 12px; }
  input[type=range] { width: 130px; accent-color: #d9895a; }
  input[type=search] {
    background: #14161c; border: 1px solid #2a2e37; color: #d7dae2;
    border-radius: 7px; padding: 6px 10px; width: 190px; font: inherit;
  }
  button {
    background: #1b1e25; border: 1px solid #2a2e37; color: #d7dae2;
    border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { background: #23272f; }
  main { padding: 8px 20px 60px; }
  section > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
    color: #7e838f; margin: 26px 0 12px; font-weight: 600;
  }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  }
  .cell {
    background: #101217; border: 1px solid #1c1f27; border-radius: 12px;
    padding: 10px 8px 9px; text-align: center; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .cell:hover { border-color: #d9895a55; transform: translateY(-2px); }
  .cell canvas { width: 116px; height: 116px; display: block; margin: 0 auto; border-radius: 10px; background: #060709; }
  .cell .lbl { margin-top: 7px; font-size: 12px; color: #d7dae2; }
  .cell .pid { font-size: 10px; color: #6b7079; font-family: ui-monospace, Menlo, monospace; }
  .hidden { display: none !important; }
  #overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(6, 7, 9, .9);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  #overlay.show { display: flex; }
  #overlay canvas { width: 340px; height: 340px; background: #060709; border-radius: 20px; }
  #overlay .oi { text-align: center; max-width: 460px; padding: 0 20px; }
  #overlay .ot { font-size: 15px; font-weight: 600; }
  #overlay .op { font-family: ui-monospace, Menlo, monospace; color: #d9895a; font-size: 12px; margin-top: 2px; }
  #overlay .od { color: #9aa0ac; margin-top: 8px; }
  #overlay .hint { color: #61656e; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>🐾 PC&nbsp;Pet — Galerie</h1>
  <div class="ctl"><label>Vitesse</label><input type="range" id="speed" min="0.3" max="2.5" step="0.1" value="1"><span id="speedv" style="color:#8b909c;width:30px">1x</span></div>
  <div class="ctl"><button id="pause">⏸ Pause</button></div>
  <div class="ctl"><input type="search" id="filter" placeholder="filtrer (nom, pose…)"></div>
  <div class="ctl" style="color:#6b7079" id="count"></div>
</header>
<main id="main"></main>

<div id="overlay">
  <canvas id="obig" width="680" height="680"></canvas>
  <div class="oi">
    <div class="ot" id="ott"></div>
    <div class="op" id="opp"></div>
    <div class="od" id="odd"></div>
  </div>
  <div class="hint">clic n’importe où pour fermer</div>
</div>

// ---- rendu d'une frame sur un canvas -------------------------------------
// ---- fonds "ambiance" par identité (comme dans pet.js) ------------------
function ambMatrix(gg, st, t, w, h, CELL) {
  const rows = Math.ceil(h / CELL) + 2, ncol = Math.ceil(w / CELL) + 1;
  if (!st.cols) { st.cols = []; st.tPrev = t;
    for (let c = 0; c < ncol; c++) st.cols.push({ y: -Math.random() * rows, spd: 7 + Math.random() * 11, len: 3 + (Math.random() * 6 | 0) }); }
  const dt = Math.min(.05, Math.max(0, t - st.tPrev)); st.tPrev = t;
  for (let c = 0; c < ncol; c++) {
    const col = st.cols[c] || (st.cols[c] = { y: -Math.random() * rows, spd: 7 + Math.random() * 11, len: 3 + (Math.random() * 6 | 0) });
    col.y += col.spd * dt; const head = Math.floor(col.y);
    for (let i = 0; i < col.len; i++) {
      const py = (head - i) * CELL + CELL / 2; if (py < -CELL || py > h + CELL) continue;
      const a = i === 0 ? .95 : (1 - i / col.len) * .4;
      gg.fillStyle = i === 0 ? `rgba(210,255,220,${a})` : `rgba(55,215,105,${a})`;
      gg.beginPath(); gg.arc(c * CELL + CELL / 2, py, CELL * .28, 0, 7); gg.fill();
    }
    if (head - col.len > rows) { col.y = -Math.random() * rows * .6; col.spd = 7 + Math.random() * 11; col.len = 3 + (Math.random() * 6 | 0); }
  }
}
function ambDiscord(gg, st, t, w, h, CELL) {
  if (!st.msgs) { st.msgs = []; st.tPrev = t;
    for (let i = 0; i < 6; i++) st.msgs.push({ y: Math.random() * h, x: (.12 + Math.random() * .5) * w, spd: 14 + Math.random() * 12, wd: (2.2 + Math.random() * 2.4) * CELL, lines: 1 + (Math.random() * 2 | 0), side: Math.random() < .5 ? -1 : 1 }); }
  const dt = Math.min(.05, Math.max(0, t - st.tPrev)); st.tPrev = t;
  for (const m of st.msgs) {
    m.y -= m.spd * dt;
    if (m.y < -3 * CELL) { m.y = h + Math.random() * 3 * CELL; m.x = (.1 + Math.random() * .6) * w; m.wd = (2.2 + Math.random() * 2.4) * CELL; m.lines = 1 + (Math.random() * 2 | 0); m.side = Math.random() < .5 ? -1 : 1; }
    const fade = Math.min(1, m.y / h) * Math.min(1, (h - m.y) / (h * .3)); if (fade <= .02) continue;
    const bx = m.side < 0 ? m.x : w - m.x - m.wd;
    gg.fillStyle = `rgba(148,158,255,${.16 * fade})`;
    for (let l = 0; l < m.lines; l++) { const lw = l === m.lines - 1 ? m.wd * .6 : m.wd; gg.fillRect(bx, m.y + l * CELL * .9, lw, CELL * .5); }
    gg.fillStyle = `rgba(120,132,246,${.22 * fade})`; gg.beginPath(); gg.arc(bx - CELL * .9, m.y + CELL * .25, CELL * .5, 0, 7); gg.fill();
  }
}
function ambYoutube(gg, st, t, w, h, CELL) {
  const off = (t * 40) % (CELL * 2);
  gg.fillStyle = 'rgba(255,90,80,0.04)';
  for (let y = -CELL * 2 + off; y < h; y += CELL * 2) gg.fillRect(0, y, w, CELL * .6);
  const flick = .10 + .10 * Math.abs(Math.sin(t * 5.5)) + .04 * Math.sin(t * 23);
  const lg = gg.createLinearGradient(0, h, 0, h * .35);
  lg.addColorStop(0, `rgba(255,${90 + 40 * Math.sin(t * 3)},70,${flick})`);
  lg.addColorStop(1, 'rgba(255,80,70,0)');
  gg.fillStyle = lg; gg.fillRect(0, 0, w, h);
}
function ambAffinity(gg, st, t, w, h, CELL) {
  const mx = w / 2, my = h / 2, R2 = (R + 1.2) * CELL, step = CELL * 2;
  gg.strokeStyle = 'rgba(167,241,117,0.05)'; gg.lineWidth = 1; gg.beginPath();
  for (let gx = mx % step; gx < w; gx += step) { gg.moveTo(gx, 0); gg.lineTo(gx, h); }
  for (let gy = my % step; gy < h; gy += step) { gg.moveTo(0, gy); gg.lineTo(w, gy); }
  gg.stroke();
  gg.strokeStyle = 'rgba(190,255,150,0.18)'; gg.lineWidth = 1.4;
  const s = R2 * .72;
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const c2x = mx + sx * s, c2y = my + sy * s;
    gg.beginPath(); gg.moveTo(c2x - sx * CELL, c2y); gg.lineTo(c2x, c2y);
    gg.moveTo(c2x, c2y - sy * CELL); gg.lineTo(c2x, c2y); gg.stroke();
  }
}
function ambVscode(gg, st, t, w, h, CELL) {
  const lh = CELL * 1.3;
  if (!st.rows) { st.rows = []; st.tPrev = t; st.off = 0;
    for (let i = 0; i < 40; i++) st.rows.push({ indent: (Math.random() * 4 | 0), len: 2.5 + Math.random() * 5.5, tok: Math.random() }); }
  const dt = Math.min(.05, Math.max(0, t - st.tPrev)); st.tPrev = t;
  st.off += lh * .55 * dt;
  if (st.off > lh) { st.off -= lh; st.rows.push(st.rows.shift()); }
  const x0 = w * .5 - CELL * 9;
  for (let r = 0; r < st.rows.length; r++) {
    const row = st.rows[r], y = -lh + r * lh - st.off;
    if (y < -lh || y > h) continue;
    gg.fillStyle = 'rgba(0,122,204,0.10)';
    gg.fillRect(x0 - CELL * 1.6, y + lh * .3, CELL * .9, CELL * .4);
    const ix = x0 + row.indent * CELL * 1.1;
    gg.fillStyle = `rgba(120,190,255,${.11 + row.tok * .06})`;
    gg.fillRect(ix, y + lh * .28, row.len * CELL, CELL * .44);
  }
  if ((t % 1) < .5) { gg.fillStyle = 'rgba(150,205,255,0.5)'; gg.fillRect(w * .5 + CELL * 2, h * .5 - lh * .4, CELL * .16, lh * .85); }
}
function ambCanva(gg, st, t, w, h, CELL) {
  const mx = w / 2, my = h / 2, step = CELL * 3.2;
  if (!st.cells) { st.cells = []; st.tPrev = t; st.off = 0;
    for (let i = 0; i < 24; i++) st.cells.push({ a: 0.05 + Math.random() * 0.08, hue: (Math.random() * 4 | 0) }); }
  const dt = Math.min(.05, Math.max(0, t - st.tPrev)); st.tPrev = t;
  st.off = (st.off + dt * CELL * 0.5) % step;
  const hues = ['0,196,204', '120,90,255', '255,120,170', '255,190,70'];
  let i = 0;
  for (let gy = -step + (my % step) - st.off; gy < h; gy += step)
    for (let gx = (mx % step); gx < w; gx += step) {
      const c = st.cells[i++ % st.cells.length];
      gg.fillStyle = `rgba(${hues[c.hue]},${c.a})`;
      gg.fillRect(gx + CELL * .3, gy + CELL * .3, step - CELL * .9, step - CELL * .9);
    }
  gg.strokeStyle = 'rgba(255,120,190,0.16)'; gg.lineWidth = 1;
  gg.beginPath(); gg.moveTo(mx, 0); gg.lineTo(mx, h); gg.moveTo(0, my + CELL); gg.lineTo(w, my + CELL); gg.stroke();
}
function ambGit(gg, st, t, w, h, CELL) {
  const lh = CELL * 2.2, x0 = w * .5 - CELL * 8;
  if (!st.o) { st.o = 0; st.tPrev = t; }
  const dt = Math.min(.05, Math.max(0, t - st.tPrev)); st.tPrev = t;
  st.o = (st.o + dt * CELL * .6) % lh;
  gg.strokeStyle = 'rgba(139,148,158,0.18)'; gg.lineWidth = 1.4;
  gg.beginPath(); gg.moveTo(x0, 0); gg.lineTo(x0, h); gg.stroke();
  gg.strokeStyle = 'rgba(88,166,255,0.16)';
  gg.beginPath(); gg.moveTo(x0 + CELL * 2.2, 0); gg.lineTo(x0 + CELL * 2.2, h); gg.stroke();
  for (let y = -lh + (h % lh) - st.o; y < h + lh; y += lh) {
    gg.fillStyle = 'rgba(160,175,195,0.35)';
    gg.beginPath(); gg.arc(x0, y, CELL * .32, 0, 7); gg.fill();
    if (Math.round(y / lh) % 3 === 0) {
      gg.fillStyle = 'rgba(88,166,255,0.3)';
      gg.beginPath(); gg.arc(x0 + CELL * 2.2, y - lh * .5, CELL * .28, 0, 7); gg.fill();
      gg.strokeStyle = 'rgba(88,166,255,0.16)';
      gg.beginPath(); gg.moveTo(x0, y); gg.lineTo(x0 + CELL * 2.2, y - lh * .5); gg.stroke();
    }
  }
}
const AMB = { matrix: ambMatrix, discord: ambDiscord, youtube: ambYoutube, affinity: ambAffinity, vscode: ambVscode, canva: ambCanva, git: ambGit };

function paint(gg, S, item, t) {
  const per = item.per || 3;
  const phase = (item.layer === 2 || item.phased) ? (t % per) / per : 0;
  const mode = item.mode || 'day';

  if (item.cos) Object.assign(cosmetics, NEUTRAL_COS, item.cos);
  clearBuf();
  const pose = item.pose || 'rest';
  const layer = item.layer || (pose === 'rest' || pose.startsWith('scene:') ? 1 : 3);
  drawCreature({ layer, pose, phase, mode, decor: null, energy: 0.7, collapseStart: 0 }, t);
  if (item.cos) Object.assign(cosmetics, NEUTRAL_COS);

  const T = TINTS[item.tint] || TINTS._;
  const CELL = S / N * .9, mx = S / 2, my = S / 2;
  const rad = Math.min(S / 2 - 2, (R + 0.6) * CELL);
  gg.clearRect(0, 0, S, S);
  // disque "boîtier" opaque (comme l'app)
  gg.beginPath(); gg.arc(mx, my, rad, 0, Math.PI * 2);
  gg.fillStyle = `rgb(${T.bg})`; gg.fill();
  gg.save(); gg.beginPath(); gg.arc(mx, my, rad, 0, Math.PI * 2); gg.clip();
  const vg = gg.createLinearGradient(0, my - rad, 0, my + rad);
  vg.addColorStop(0, 'rgba(255,255,255,0.055)'); vg.addColorStop(.5, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.22)');
  gg.fillStyle = vg; gg.fillRect(mx - rad, my - rad, rad * 2, rad * 2);
  gg.restore();
  gg.beginPath(); gg.arc(mx, my, rad - .75, 0, Math.PI * 2);
  gg.strokeStyle = `rgba(${T.lit},0.18)`; gg.lineWidth = 1.3; gg.stroke();

  const amb = AMB[item.tint];
  if (amb) { gg.save(); gg.beginPath(); gg.arc(mx, my, rad, 0, Math.PI * 2); gg.clip();
    item._amb = item._amb || {}; amb(gg, item._amb, t, S, S, CELL); gg.restore(); }

  const off = (S - CELL * N) / 2;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (Math.hypot(x - CENTER, y - CENTER) > R) continue;
    const v = buf[idx(x, y)];
    const cx = off + x * CELL + CELL / 2, cy = off + y * CELL + CELL / 2;
    gg.beginPath(); gg.fillStyle = `rgba(${T.off})`;
    gg.arc(cx, cy, CELL * .30, 0, 7); gg.fill();
    if (v > .02) {
      const q = Math.round(v * 8) / 8;
      gg.beginPath();
      gg.fillStyle = `rgba(${T.lit},${.24 + q * .76})`;
      gg.shadowColor = `rgba(${T.glow})`;
      gg.shadowBlur = CELL * .7 * q;
      gg.arc(cx, cy, CELL * .36, 0, 7); gg.fill();
      gg.shadowBlur = 0;
    }
  }
}

// ---- construction de la page -------------------------------------------
const main = document.getElementById('main');
const cells = [];
const dpr = Math.min(2, window.devicePixelRatio || 1);
let total = 0;

for (const sec of SECTIONS) {
  const s = document.createElement('section');
  s.innerHTML = `<h2>${sec.title}</h2>`;
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const item of sec.items) {
    total++;
    const pid = item.pid || item.pose;
    const el = document.createElement('div'); el.className = 'cell';
    const cv = document.createElement('canvas');
    cv.width = 116 * dpr; cv.height = 116 * dpr;
    const gg = cv.getContext('2d'); gg.scale(dpr, dpr);
    el.appendChild(cv);
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = item.label;
    const p = document.createElement('div'); p.className = 'pid'; p.textContent = pid;
    el.appendChild(l); el.appendChild(p);
    el.addEventListener('click', () => openBig(item));
    grid.appendChild(el);
    cells.push({ gg, S: 116, item, el, hay: (item.label + ' ' + pid).toLowerCase() });
  }
  s.appendChild(grid); main.appendChild(s);
}
document.getElementById('count').textContent = total + ' emotes';

// ---- boucle d'animation ------------------------------------------------
let speed = 1, paused = false, base = performance.now(), acc = 0, lastNow = base;
function loop(now) {
  if (!paused) acc += (now - lastNow) / 1000 * speed;
  lastNow = now;
  const t = acc + 0.4;
  for (const c of cells) {
    if (c.el.classList.contains('hidden')) continue;
    paint(c.gg, c.S, c.item, t);
  }
  if (bigItem) paint(bigG, 340, bigItem, t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- contrôles --------------------------------------------------------
const speedEl = document.getElementById('speed'), speedV = document.getElementById('speedv');
speedEl.addEventListener('input', () => { speed = +speedEl.value; speedV.textContent = speed.toFixed(1).replace(/\.0$/, '') + 'x'; });
const pauseB = document.getElementById('pause');
pauseB.addEventListener('click', () => { paused = !paused; pauseB.textContent = paused ? '▶ Lecture' : '⏸ Pause'; });
document.getElementById('filter').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  for (const c of cells) c.el.classList.toggle('hidden', q && !c.hay.includes(q));
});

// ---- overlay ----------------------------------------------------------
const overlay = document.getElementById('overlay');
const bigCv = document.getElementById('obig');
bigCv.width = 340 * dpr; bigCv.height = 340 * dpr;
const bigG = bigCv.getContext('2d'); bigG.scale(dpr, dpr);
let bigItem = null;
function openBig(item) {
  bigItem = item;
  document.getElementById('ott').textContent = item.label;
  document.getElementById('opp').textContent = item.pid || item.pose;
  document.getElementById('odd').textContent = item.d || '';
  overlay.classList.add('show');
}
overlay.addEventListener('click', () => { overlay.classList.remove('show'); bigItem = null; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { overlay.classList.remove('show'); bigItem = null; } });
</script>
