<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    -webkit-user-select: none; cursor: default; font: 11px -apple-system, sans-serif; }

  #shelf {
    position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 4px; padding: 9px 7px;
    background: rgba(18, 19, 24, 0.82);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    align-items: center;
  }
  .treat {
    position: relative;
    width: 40px; height: 40px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    cursor: grab; background: rgba(255,255,255,0.045);
    transition: transform .12s, background .12s;
  }
  .treat canvas { width: 34px; height: 34px; display: block; }
  .treat:hover { background: rgba(255,255,255,0.12); transform: translateX(-3px) scale(1.08); }
  .treat.taken { opacity: 0; pointer-events: none; }
  /* étiquette au survol : le nom de la friandise, à gauche de la barre */
  .treat::after {
    content: attr(data-name);
    position: absolute; right: calc(100% + 10px); top: 50%;
    transform: translateY(-50%) translateX(6px);
    padding: 3px 8px; border-radius: 7px; white-space: nowrap;
    font-size: 11px; color: #fff; background: rgba(18,19,24,0.94);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity .1s, transform .1s;
  }
  .treat:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
  .treat.taken::after { display: none; }
  #hint {
    color: rgba(255,255,255,0.4); font-size: 10px; text-align: center;
    max-width: 42px; line-height: 1.2; margin-top: 3px;
  }
  #hub-btn {
    margin-top: 7px; width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.55); font: 600 11px/1 -apple-system, sans-serif;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  #hub-btn:hover { background: rgba(255,255,255,0.16); color: #fff; }

  #fly {
    position: fixed; left: 0; top: 0; pointer-events: none;
    transform: translate(-50%, -50%); display: none; z-index: 9;
    filter: drop-shadow(0 3px 7px rgba(0,0,0,0.55));
  }
  #fly canvas { width: 40px; height: 40px; display: block; }
  #fly.drop { transition: transform .4s cubic-bezier(.4,1.3,.6,1), opacity .4s; }
  #fly.eat  { transition: transform .3s ease-in, opacity .3s; }
</style>
</head>
<body>
  <div id="shelf">
    <div class="treat" data-kind="cookie"  data-name="Cookie"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="bone"    data-name="Os"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="berry"   data-name="Fraise"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="fish"    data-name="Poisson"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="candy"   data-name="Bonbon"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="carrot"  data-name="Carotte"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="chili"   data-name="Piment"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="donut"   data-name="Donut"><canvas width="68" height="68"></canvas></div>
    <div class="treat" data-kind="battery" data-name="Pile"><canvas width="68" height="68"></canvas></div>
    <div id="hint">glisse sur le perso</div>
    <button id="hub-btn" title="Galerie des emotes">i</button>
  </div>
  <div id="fly"><canvas width="80" height="80"></canvas></div>

<script>
const P = window.pcpet;
const shelf = document.getElementById('shelf');
const fly = document.getElementById('fly');
const flyCv = fly.querySelector('canvas');

// ---- friandises dessinées en points, façon matrice LED du compagnon ----
// # = point vif, o = point tamisé, . = vide
const PATTERNS = {
  cookie: [
    "...#####...",
    "..#######..",
    ".####o####.",
    ".#########.",
    "#####o#####",
    "###########",
    "#####o#####",
    ".####o####.",
    ".#########.",
    "..#######..",
    "...#####...",
  ],
  bone: [
    "##.......##",
    "####...####",
    ".#########.",
    ".#########.",
    "####...####",
    "##.......##",
  ],
  berry: [
    "....#.#....",
    "...#####...",
    "....###....",
    ".#########.",
    "##o#####o##",
    "###########",
    ".#o#####o#.",
    ".##o###o##.",
    "..#######..",
    "...#o#o#...",
    "....###....",
  ],
  fish: [
    "...####..#...",
    "..######.##..",
    ".###o#####.##",
    "####o########",
    ".###o#####.##",
    "..######.##..",
    "...####..#...",
  ],
  candy: [
    "#.........#",
    "##.......##",
    ".##.###.##.",
    "..#######..",
    "..#######..",
    "..#######..",
    ".##.###.##.",
    "##.......##",
    "#.........#",
  ],
  carrot: [
    "..#.#.#..",
    "...###...",
    "..#####..",
    "..#####..",
    "...###...",
    "...###...",
    "....#....",
    "....#....",
    "....#....",
  ],
  chili: [
    "....##...",
    "....#....",
    "...##....",
    "..###....",
    "..####...",
    "..#####..",
    "...#####.",
    "...####..",
    "....##...",
    ".....#...",
  ],
  donut: [
    "..#####..",
    ".###o###.",
    "##o...o##",
    "#o.....o#",
    "#o.....o#",
    "#o.....o#",
    "##o...o##",
    ".###o###.",
    "..#####..",
  ],
  battery: [
    "...###...",
    "#########",
    "#.......#",
    "#...##..#",
    "#..##...#",
    "#.#####.#",
    "#...##..#",
    "#..##...#",
    "#.......#",
    "#########",
  ],
};

function drawTreat(cv, kind) {
  const g = cv.getContext('2d');
  const pat = PATTERNS[kind], H = pat.length, W = pat[0].length;
  const S = cv.width, cell = Math.min(S / (W + 1), S / (H + 1));
  const ox = (S - cell * W) / 2, oy = (S - cell * H) / 2;
  g.clearRect(0, 0, S, S);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ch = pat[y][x];
      if (ch === '.') continue;
      const cx = ox + x * cell + cell / 2, cy = oy + y * cell + cell / 2;
      const dim = ch === 'o';
      g.beginPath();
      g.fillStyle = dim ? 'rgba(233,239,253,0.30)' : 'rgba(233,239,253,0.95)';
      g.shadowColor = 'rgba(200,220,255,0.9)';
      g.shadowBlur = dim ? 0 : cell * 0.8;
      g.arc(cx, cy, cell * 0.36, 0, 7);
      g.fill();
    }
  }
  g.shadowBlur = 0;
}

for (const el of shelf.querySelectorAll('.treat')) drawTreat(el.querySelector('canvas'), el.dataset.kind);

document.getElementById('hub-btn').addEventListener('click', () => P && P.openHub());

let drag = null, overShelf = false;

function inShelf(x, y) {
  const r = shelf.getBoundingClientRect();
  return x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8;
}

function cancelDrag() {
  if (!drag) return;
  drag.el.classList.remove('taken');
  drag = null;
  fly.style.display = 'none';
  overShelf = false; P && P.setClickable(false);
}
addEventListener('blur', cancelDrag);

addEventListener('mousemove', (e) => {
  if (drag) {
    if (e.buttons === 0) { cancelDrag(); return; }     // bouton relâché hors de la fenêtre
    fly.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
    return;
  }
  const now = inShelf(e.clientX, e.clientY);
  if (now !== overShelf) { overShelf = now; P && P.setClickable(now); }
});

for (const el of shelf.querySelectorAll('.treat')) {
  el.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || drag) return;
    e.preventDefault();
    drag = { kind: el.dataset.kind, el };
    el.classList.add('taken');
    drawTreat(flyCv, el.dataset.kind);
    fly.className = '';
    fly.style.display = 'block';
    fly.style.opacity = '1';
    fly.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
    P && P.setClickable(true);
  });
}

addEventListener('mouseup', async (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  const bounds = P ? await P.petBounds() : null;
  const onPet = bounds &&
    e.screenX >= bounds.x && e.screenX <= bounds.x + bounds.width &&
    e.screenY >= bounds.y && e.screenY <= bounds.y + bounds.height;

  if (onPet) {
    P && P.feed(d.kind);
    fly.className = 'eat';
    fly.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%) scale(0.2)`;
    fly.style.opacity = '0';
    setTimeout(() => { fly.style.display = 'none'; }, 320);
    setTimeout(() => d.el.classList.remove('taken'), 2600);
  } else {
    fly.className = 'drop';
    fly.style.transform = `translate(${e.clientX}px, ${e.clientY + 60}px) translate(-50%,-50%) rotate(40deg)`;
    fly.style.opacity = '0';
    setTimeout(() => { fly.style.display = 'none'; d.el.classList.remove('taken'); }, 420);
  }
  overShelf = inShelf(e.clientX, e.clientY);
  P && P.setClickable(overShelf);
});
</script>
</body>
</html>
